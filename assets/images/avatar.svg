<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070913" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#ringGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Inner Circle Background -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Abstract Code / Tech Grid in background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="80" x2="300" y2="80" />
    <line x1="80" y1="140" x2="320" y2="140" />
    <line x1="80" y1="260" x2="320" y2="260" />
    <line x1="100" y1="320" x2="300" y2="320" />
  </g>

  <!-- Stylized Tech Avatar Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M110 330 C125 255, 160 235, 200 235 C240 235, 275 255, 290 330 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Hoodie / Collar Inner -->
  <path d="M165 242 Q200 270 235 242" fill="none" stroke="#8b5cf6" stroke-width="3" />
  
  <!-- Head & Neck -->
  <rect x="184" y="200" width="32" height="30" rx="6" fill="#334155" />
  <circle cx="200" cy="160" r="48" fill="#1e293b" stroke="#475569" stroke-width="2" />

  <!-- Glasses / Developer HUD Visor -->
  <rect x="170" y="148" width="25" height="15" rx="3" fill="#0b0f19" stroke="#38bdf8" stroke-width="2" />
  <rect x="205" y="148" width="25" height="15" rx="3" fill="#0b0f19" stroke="#38bdf8" stroke-width="2" />
  <line x1="195" y1="155" x2="205" y2="155" stroke="#38bdf8" stroke-width="2" />
  <line x1="174" y1="155" x2="191" y2="155" stroke="#ec4899" stroke-width="1.5" />
  <line x1="209" y1="155" x2="226" y2="155" stroke="#ec4899" stroke-width="1.5" />

  <!-- Hair / Silhouette Details -->
  <path d="M152 155 C150 120, 175 105, 200 105 C225 105, 250 120, 248 155 C240 130, 220 122, 200 122 C180 122, 160 130, 152 155 Z" fill="#0f172a" />

  <!-- Glowing Code Accents -->
  <text x="80" y="190" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold" opacity="0.8">&lt;/&gt;</text>
  <text x="295" y="190" fill="#ec4899" font-family="monospace" font-size="20" font-weight="bold" opacity="0.8">{ ; }</text>
  <text x="180" y="365" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="3">DEV // CSE</text>
</svg>
