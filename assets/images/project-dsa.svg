<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#190a2a" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="16" fill="url(#dsaBg)" />

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <!-- Code Card Window Mockup -->
  <rect x="40" y="45" width="260" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M40 57 A 12 12 0 0 1 52 45 L 288 45 A 12 12 0 0 1 300 57 L 300 75 L 40 75 Z" fill="#1e293b" />
  <circle cx="58" cy="60" r="4.5" fill="#ef4444" />
  <circle cx="73" cy="60" r="4.5" fill="#eab308" />
  <circle cx="88" cy="60" r="4.5" fill="#22c55e" />
  <text x="105" y="64" fill="#94a3b8" font-family="monospace" font-size="11">BinarySearchTree.java</text>

  <!-- Java Code Mock -->
  <g font-family="monospace" font-size="10.5">
    <text x="55" y="102" fill="#f43f5e">public class <tspan fill="#38bdf8">BSTNode</tspan> {</text>
    <text x="70" y="124" fill="#94a3b8">int key, height;</text>
    <text x="70" y="146" fill="#94a3b8">BSTNode left, right;</text>
    <text x="55" y="172" fill="#f43f5e">public <tspan fill="#38bdf8">void</tspan> <tspan fill="#a78bfa">insert</tspan>(int v) {</text>
    <text x="70" y="194" fill="#64748b">// O(log N) average</text>
    <text x="70" y="216" fill="#e2e8f0">if (v &lt; key) left.insert(v);</text>
    <text x="70" y="238" fill="#e2e8f0">else right.insert(v);</text>
    <text x="55" y="260" fill="#f43f5e">}</text>
    <text x="45" y="282" fill="#f43f5e">}</text>
  </g>

  <!-- Right Visual: Interactive Data Structure Graph / Tree -->
  <g transform="translate(320, 50)">
    <!-- Tree Edges -->
    <line x1="125" y1="40" x2="65" y2="105" stroke="#475569" stroke-width="2.5" />
    <line x1="125" y1="40" x2="185" y2="105" stroke="#475569" stroke-width="2.5" />
    <line x1="65" y1="105" x2="35" y2="170" stroke="#475569" stroke-width="2" />
    <line x1="65" y1="105" x2="95" y2="170" stroke="#475569" stroke-width="2" />
    <line x1="185" y1="105" x2="155" y2="170" stroke="#475569" stroke-width="2" />
    <line x1="185" y1="105" x2="215" y2="170" stroke="#475569" stroke-width="2" />

    <!-- Root Node -->
    <circle cx="125" cy="40" r="22" fill="url(#pinkGrad)" stroke="#fbcfe8" stroke-width="2" />
    <text x="117" y="46" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">50</text>

    <!-- Level 1 Nodes -->
    <circle cx="65" cy="105" r="18" fill="url(#treeGrad)" stroke="#bae6fd" stroke-width="2" />
    <text x="58" y="110" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">30</text>

    <circle cx="185" cy="105" r="18" fill="url(#treeGrad)" stroke="#bae6fd" stroke-width="2" />
    <text x="178" y="110" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">70</text>

    <!-- Level 2 Nodes -->
    <circle cx="35" cy="170" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="29" y="174" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">20</text>

    <circle cx="95" cy="170" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="89" y="174" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">40</text>

    <circle cx="155" cy="170" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="149" y="174" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">60</text>

    <circle cx="215" cy="170" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="209" y="174" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">85</text>

    <!-- Big O Badge -->
    <rect x="25" y="215" width="200" height="34" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="45" y="237" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold">Time: O(log N) | Space: O(N)</text>
  </g>
</svg>
